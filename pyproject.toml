[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccn-transcribe"
version = "0.1.0"
description = "Download videos, extract FLAC, and transcribe with Whisper on whatever GPU is present."
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "numpy>=2.5,<3",
    "huggingface-hub>=1.31,<2",
    "yt-dlp[default,deno]>=2026.8.19",
    "yt-dlp-ejs>=0.8",
    "openvino==2026.3.1",
    "openvino-genai==2026.3.1.0",
]

[project.scripts]
ccn-transcribe = "ccn_transcribe.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "mypy>=1.11",
    "pylint>=3.2",
    "pre-commit>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ccn_transcribe"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# ruff format also restyles Python blocks inside Markdown; docs are not ours to restyle.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RET", "ARG", "TID", "TC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pylint.design]
max-attributes = 10

[tool.pylint.main]
disable = ["C0114", "C0115", "C0116", "C0301", "W0611", "W0612", "R0801"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# NOTE: --cov-fail-under deliberately lives in the pre-commit hook, not here, so a
# single-file TDD run (`uv run pytest tests/test_x.py`) is not blocked by coverage.
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src/ccn_transcribe"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
    "@overload",
    "raise NotImplementedError",
    "class .*\\(Protocol\\):",
]
